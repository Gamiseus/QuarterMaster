#:schema https://gamiseus.github.io/schemas/qm.schema.json
# Example Mod: a debug-mode page.
# debug.lua adds a card and a page to Mod Operations only when debug mode is on, so players
# never see them. Turn debug mode on in the launcher's Settings.
# Change first: what the page's button prints.
# Wiki: Part 10, Debug mode: https://gamiseus.github.io/wiki/testing-and-debugging/#debug-mode

[manifest]
version = "1.0.0"

[[patches]]
[patches.module]
id = "example_mod:debug_module"
source = "debug.lua"
name = "includes/example_mod_debug"
before = "main.lua"

[[patches]]
[patches.pattern]
id = "example_mod:debug_require"
target = "main.lua"
pattern = 'require "includes/directives"'
position = "after"
payload = 'ExampleMod = require "includes/example_mod_debug"'
