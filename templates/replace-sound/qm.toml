#:schema https://gamiseus.github.io/schemas/qm.schema.json
# Example Mod: a replaced sound.
# assets/sounds/garand1.wav takes the place of the game's sounds/garand1.wav (one of the M1
# Garand's shots). The file here is a short placeholder tone; put your own recording there.
# Change first: the file in assets/sounds/. The name must match the game's file.
# Wiki: Part 2, How a file finds what it replaces:
#   https://gamiseus.github.io/wiki/replacing-art-and-sound/#how-a-file-finds-what-it-replaces
# Try next: start the game in debug mode and press Ctrl+Shift+Alt+D to get every game file,
# with its name, in Mods/qm/game-dump-full/.

[manifest]
version = "1.0.0"
