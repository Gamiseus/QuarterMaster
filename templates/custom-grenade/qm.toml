#:schema https://gamiseus.github.io/schemas/qm.schema.json
# Example Mod: a custom grenade.
# grenade.lua registers an explosion and a grenade with QM.Explosions and QM.Ordnance; the
# light infantry's second skill throws it. mod.json lists "ordnance" in qm_features, which
# also makes QuarterMaster add the hooks ordnance needs (QuarterMaster 2.2.0 or newer).
# Change first: the explosion's numbers, then the grenade's range and cooldown.
# Wiki: Part 5, Ordnance: https://gamiseus.github.io/wiki/adding-your-own-lua-files/#ordnance-qmordnance
# Try next: replaces_frag = "axis", so the Axis throws it too.

[manifest]
version = "1.0.0"

[[patches]]
[patches.module]
id = "example_mod:grenade_module"
source = "grenade.lua"
name = "includes/example_mod_grenade"
before = "main.lua"

# Load it once the game's own files are loaded: the grenade is registered then.
[[patches]]
[patches.pattern]
id = "example_mod:grenade_require"
target = "main.lua"
pattern = 'require "includes/directives"'
position = "after"
payload = 'ExampleMod = require "includes/example_mod_grenade"'
