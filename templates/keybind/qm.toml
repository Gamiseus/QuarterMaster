#:schema https://gamiseus.github.io/schemas/qm.schema.json
# Example Mod: loads keybind.lua, which answers the keybind in config.toml.

[manifest]
version = "1.0.0"

[[patches]]
[patches.module]
id = "example_mod:keybind_module"
source = "keybind.lua"
name = "includes/example_mod_keybind"
before = "main.lua"

[[patches]]
[patches.pattern]
id = "example_mod:keybind_require"
target = "main.lua"
pattern = 'require "includes/directives"'
position = "after"
payload = 'ExampleMod = require "includes/example_mod_keybind"'
