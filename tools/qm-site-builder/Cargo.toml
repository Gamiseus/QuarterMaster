[package]
name = "qm-site-builder"
version = "1.2.0"
edition = "2021"
description = "Builds the gamiseus.github.io site and its mod index (runs in GitHub Actions; not shipped with the launcher)."
publish = false

[[bin]]
name = "qm-site-builder"
path = "src/main.rs"

[dependencies]
qm-schema = { path = "../../crates/qm-schema" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0"
toml = "0.8.10"
ureq = { version = "2.10", features = ["json"] }
zip = { workspace = true }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
ammonia = "4"
url = "2"
regex-lite = "0.1.5"
