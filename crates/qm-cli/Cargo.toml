[package]
name = "qm-cli"
version = "1.0.0"
edition = "2021"
description = "Headless CLI and URL protocol handler for QuarterMaster Mod Launcher"
authors = ["QuarterMaster Team"]
license = "MIT"

[[bin]]
name = "qm"
path = "src/main.rs"

[dependencies]
qm-schema = { path = "../qm-schema" }
qm-core = { path = "../qm-core" }
qm-manager = { path = "../qm-manager" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0.100"
