[package]
name = "qm-schema"
version = "1.0.0"
edition = "2021"
description = "Metadata schemas, version comparator, save parser, config parser, and security linter for QuarterMaster"
authors = ["QuarterMaster Team"]
license = "MIT"

[dependencies]
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0"
regex-lite = "0.1.5"
sha2 = "0.10.8"
walkdir = "2.5.0"
specta = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[features]
specta = ["dep:specta"]
