[package]
name = "qm-service"
version = "1.0.0"
edition = "2021"
description = "Tauri-free application layer for QuarterMaster"
authors = ["QuarterMaster Team"]
license = "MIT"

[dependencies]
qm-manager = { path = "../qm-manager", features = ["specta"] }
qm-schema = { path = "../qm-schema" }
qm-core = { path = "../qm-core" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
specta = { workspace = true }
notify = "8"
notify-debouncer-mini = "0.6"
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }
tracing = "0.1"
sha2 = "0.10.8"
jiff = "0.2.35"

[dev-dependencies]
tempfile = "3"
zip = "6.0.0"
