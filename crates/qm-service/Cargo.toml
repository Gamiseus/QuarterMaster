[package]
name = "qm-service"
version = "2.2.0"
edition = "2021"
description = "Tauri-free application layer for QuarterMaster"
authors = ["QuarterMaster Team"]
license = "MIT"

[dependencies]
qm-manager = { path = "../qm-manager", features = ["specta"] }
qm-schema = { path = "../qm-schema" }
qm-core = { path = "../qm-core" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
specta = { workspace = true }
notify = "8"
notify-debouncer-mini = "0.6"
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }
tracing = "0.1"
sha2 = "0.10.8"
jiff = { workspace = true }
# Reads game sprites from the payload; qm-manager already links it.
zip = { workspace = true }
toml = "0.8.10"
# Saves patches into qm.toml with its comments and layout kept; the version `toml` uses.
toml_edit = "0.22.6"
# Stages a mod for the Patch Studio's previews; qm-manager already links it.
tempfile = "3"
# Reads the game's image globals for the sprite line-up; qm-core already links it.
regex-lite = "0.1.5"

[dev-dependencies]
qm-manager = { path = "../qm-manager", features = ["specta", "test-seams"] }
tempfile = "3"
